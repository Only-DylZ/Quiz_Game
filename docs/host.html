<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz-Abend – Host</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="host">
  <!-- Host-Bildschirm (TV / Discord-Stream). Die Logik steht in host.js. -->
  <main>

    <!-- 1. Lobby: Raumcode zeigen, auf Spieler warten -->
    <section id="lobby">
      <h1>Quiz-Abend</h1>
      <p>Geht auf <strong id="adresse"></strong> und gebt diesen Code ein:</p>
      <!-- Nur beim lokalen Testen sichtbar -->
      <p class="hinweis" id="lokalHinweis" hidden>
        Lokaler Test: Auf dem Handy statt 127.0.0.1 die WLAN-IP dieses PCs eingeben
        (PowerShell: <code>ipconfig</code> → IPv4-Adresse).
      </p>
      <p class="raumcode" id="raumcode">····</p>

      <h2>Spieler (<span id="anzahl">0</span>)</h2>
      <ul class="spielerliste" id="spielerliste"></ul>

      <p class="hinweis" id="paketInfo">Lade Fragen …</p>
      <button id="start" disabled>Spiel starten</button>
    </section>

    <!-- 2. Spiel: Frage, Countdown, danach Auflösung -->
    <section id="spiel" hidden>
      <p class="kopf">
        <span id="fortschritt"></span>
        <span class="countdown" id="countdown"></span>
      </p>
      <h2 class="fragetext" id="fragetext"></h2>

      <!-- Hier zeichnet der jeweilige Modus seine Inhalte -->
      <div id="bereich"></div>

      <p id="antwortZaehler"></p>

      <!-- Erst nach der Auflösung sichtbar -->
      <div id="infos" hidden>
        <p id="erklaerung"></p>
        <p class="hinweis" id="quelle"></p>
        <button id="weiter">Weiter</button>
      </div>
    </section>

    <!-- 3. Spielende -->
    <section id="ende" hidden>
      <h1>Ende!</h1>
      <p>Punkte und Rangliste kommen in Schritt 1c.</p>
    </section>

    <!-- Hier erscheinen Fehlermeldungen -->
    <p class="meldung" id="meldung"></p>
  </main>

  <script type="module" src="host.js"></script>
</body>
</html>
