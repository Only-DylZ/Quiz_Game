<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz-Abend – Mitspielen</title>
  <!-- Leaflet (Karten), feste Version + Prüfsumme: Der Browser lädt die Datei nur,
       wenn sie genau dieser Version entspricht. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
  <!-- Weltkarte (ohne Namen) schon im Hintergrund laden, falls eine Kartenfrage kommt -->
  <link rel="prefetch" href="karten/welt.json">
</head>
<body class="spieler">
  <!-- Spieler-Seite fürs Handy. Die Logik steht in play.js. -->
  <main>

    <!-- 1. Beitreten -->
    <form id="beitreten">
      <h1>Mitspielen</h1>
      <label for="code">Raumcode</label>
      <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters"
             placeholder="z. B. KX7Q" required>

      <label for="name">Dein Name</label>
      <input id="name" maxlength="16" autocomplete="nickname" required>

      <button type="submit">Beitreten</button>
    </form>

    <!-- 2. Warten auf den Spielstart oder die nächste Frage -->
    <section id="warten" hidden>
      <p>Du bist drin, <strong id="meinName"></strong>!</p>
      <p id="wartenText">Warte auf den Spielstart …</p>
    </section>

    <!-- 3. Frage beantworten -->
    <section id="frage" hidden>
      <p class="kopf">
        <span id="fortschritt"></span>
        <span class="countdown" id="countdown"></span>
      </p>
      <p class="fragetext" id="fragetext"></p>
      <!-- Bild zur Frage (falls vorhanden) -->
      <img class="fragebild" id="bild" alt="Bild zur Frage" hidden>
      <!-- Hier zeichnet der jeweilige Modus die Eingabe -->
      <div id="eingabe"></div>
      <p id="status"></p>
    </section>

    <!-- 4. Ergebnis der Frage -->
    <section id="ergebnis" hidden>
      <p class="ergebnis-gross" id="ergebnisText"></p>
      <p id="loesungText"></p>
      <p id="standText"></p>
      <p class="hinweis">Warte auf die nächste Frage …</p>
    </section>

    <!-- 5. Ende einer Themenrunde: wer bekommt den Gewinnpunkt (GP)? -->
    <section id="rundenende" hidden>
      <p class="ergebnis-gross" id="rundenSieger"></p>
      <p id="meineGp"></p>
      <p class="hinweis" id="rundenHinweis"></p>
    </section>

    <!-- 6. Spielende -->
    <section id="ende" hidden>
      <h1>Ende!</h1>
      <p class="ergebnis-gross" id="endeText"></p>
      <p>Danke fürs Mitspielen.</p>
    </section>

    <!-- Hier erscheinen Fehlermeldungen -->
    <p class="meldung" id="meldung"></p>
  </main>

  <!-- Leaflet (Karten), feste Version + Prüfsumme (siehe oben) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="play.js"></script>
</body>
</html>
